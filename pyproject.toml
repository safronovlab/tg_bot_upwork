[project]
name = "upwork-tg-bot"
version = "0.1.0"
description = "Single-user Telegram bot for AI-driven Upwork lead filtering"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "aiohttp>=3.10",
    "asyncpg>=0.29",
    "msgspec>=0.18",
    "uvloop>=0.20; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    # Real-Postgres integration tests (требуется Docker)
    "testcontainers[postgres]>=4",
    # Static analysis — версии зафиксированы в .venv через uv lock
    "ruff>=0.9",
    "mypy>=1.20",
    "bandit>=1.9",
    "radon>=6",
    "xenon>=0.9",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests против реальной Postgres через testcontainers (требует Docker)",
]

# --------------------------------------------------------------------------- #
# Static analysis configuration
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "B",      # bugbear
    "S",      # bandit (security)
    "C90",    # mccabe complexity
    "RUF",    # ruff-specific
    "UP",     # pyupgrade
    "SIM",    # simplify
    "I",      # isort
    "PIE",    # misc lints
    "PT",     # pytest style
]
ignore = [
    "E501",   # line length (форматер сам разруливает)
    "B008",   # function call in default arg — для msgspec/aiohttp нормально
    "S101",   # assert — в тестах нужны
    "S608",   # SQL injection — у нас whitelist enforced через _check_field
    "SIM117", # nested with — иногда яснее раздельно
    "RUF001", # cyrillic ambiguity — русский UI намеренный
    "RUF002", # docstring cyrillic — то же
    "RUF003", # comment cyrillic — то же
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S",       # тесты не несут secret-риска
    "B011",    # assert False
    "PT",      # тесты используют свой стиль pytest fixtures
    "E402",    # импорты группируются по модулю (читаемее для test_coverage_gaps.py)
    "RUF043",  # match=str без re.escape — обычно ОК для тестов
    "RUF059",  # _, _ = unpack — нормальный idiom
]
"src/__init__.py" = ["F401"]
"src/bot/__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["uvloop", "msgspec.*", "aiogram.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B608"]   # SQL whitelist enforced via _check_field

[tool.vulture]
paths = ["src"]
exclude = [".venv"]
min_confidence = 80
